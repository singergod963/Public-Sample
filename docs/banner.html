<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長圖預覽</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #e7ebe8;
            color: #17211d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .control {
            position: fixed;
            z-index: 2;
            inset: 0 0 auto;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: transparent;
            color: #f5f7f5;
        }

        .control h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            text-shadow: 0 1px 5px rgb(0 0 0 / 75%);
        }

        .control nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control button {
            width: 38px;
            height: 38px;
            border: 1px solid #536159;
            border-radius: 6px;
            background: #26332c;
            color: inherit;
            font: inherit;
            font-size: 23px;
            line-height: 1;
            cursor: pointer;
        }

        .control button:hover {
            background: #35453b;
        }

        .control button:focus-visible {
            outline: 2px solid #a6d8b8;
            outline-offset: 2px;
        }

        #counter {
            min-width: 42px;
            text-align: center;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 1px 5px rgb(0 0 0 / 75%);
        }

        .banner {
            height: 100%;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 0 12px;
            scrollbar-gutter: stable;
        }

        .loading {
            position: fixed;
            z-index: 0;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #e7ebe8;
            color: #536159;
            font-size: 14px;
        }

        .loading[hidden] {
            display: none;
        }

        .loading::before {
            width: 26px;
            height: 26px;
            border: 3px solid #c5d0c8;
            border-top-color: #375d47;
            border-radius: 50%;
            content: "";
            animation: spin 0.8s linear infinite;
        }

        .loading.is-error::before {
            display: none;
        }

        .banner img[hidden] {
            display: none;
        }

        .banner img {
            display: block;
            width: min(100%, 430px);
            height: auto;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 2px 16px rgb(23 33 29 / 14%);
        }

        @media (max-width: 480px) {
            .banner {
                padding-right: 0;
                padding-left: 0;
            }

            .banner img {
                box-shadow: none;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading::before {
                animation-duration: 2s;
            }
        }
    </style>
</head>
<body>
    <header class="control">
        <h1>長圖預覽</h1>
        <nav aria-label="圖片切換">
            <button id="previous" type="button" aria-label="上一張" title="上一張">&#8592;</button>
            <span id="counter" aria-live="polite">1 / 5</span>
            <button id="next" type="button" aria-label="下一張" title="下一張">&#8594;</button>
        </nav>
    </header>
    <main class="banner">
        <img id="preview" alt="第 1 張長截圖" hidden>
    </main>
    <div id="loading" class="loading" role="status" aria-live="polite">載入中...</div>
    <script>
        const preview = document.querySelector("#preview");
        const counter = document.querySelector("#counter");
        const banner = document.querySelector(".banner");
        const loading = document.querySelector("#loading");
        const imageCache = Array.from({ length: 5 }, (_, index) => {
            const image = new Image();
            const loaded = new Promise((resolve) => {
                image.onload = () => resolve(image);
                image.onerror = () => resolve(null);
            });
            image.src = `images/${index + 1}.png`;
            return loaded;
        });
        let currentImage = 1;
        let selectionVersion = 0;

        async function showImage(imageNumber) {
            currentImage = ((imageNumber - 1 + 5) % 5) + 1;
            const version = ++selectionVersion;
            counter.textContent = `${currentImage} / 5`;
            banner.scrollTop = 0;
            preview.hidden = true;
            loading.hidden = false;
            loading.classList.remove("is-error");
            loading.textContent = "載入中...";

            const image = await imageCache[currentImage - 1];
            if (version !== selectionVersion) return;

            if (!image) {
                loading.classList.add("is-error");
                loading.textContent = "圖片載入失敗";
                return;
            }

            preview.src = image.src;
            preview.alt = `第 ${currentImage} 張長截圖`;
            preview.hidden = false;
            loading.hidden = true;
        }

        document.querySelector("#previous").addEventListener("click", () => {
            showImage(currentImage - 1);
        });
        document.querySelector("#next").addEventListener("click", () => {
            showImage(currentImage + 1);
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowLeft") showImage(currentImage - 1);
            if (event.key === "ArrowRight") showImage(currentImage + 1);
        });

        showImage(1);
    </script>
</body>
</html>
